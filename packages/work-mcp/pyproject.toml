[project]
name = "work-mcp"
version = "0.1.0"
description = "Setup wizard and credential import for the candidate-side ATS MCP servers"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Krishaay", email = "mail@krishaay.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "ats-core",
    "mcp-workday",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
work-mcp = "work_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
ats-core = { workspace = true }
mcp-workday = { workspace = true }
