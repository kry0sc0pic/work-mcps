[project]
name = "ats-core"
version = "0.1.0"
description = "Shared models, credential store, and snapshot diffing for candidate-side ATS MCP servers"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Krishaay", email = "mail@krishaay.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
