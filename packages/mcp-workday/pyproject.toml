[project]
name = "mcp-workday"
version = "0.1.0"
description = "MCP server for checking job application status on Workday careers sites"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Krishaay", email = "mail@krishaay.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "ats-core",
]

[project.scripts]
mcp-workday = "mcp_workday:main"
mcp-workday-login = "mcp_workday.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
ats-core = { workspace = true }

[dependency-groups]
dev = [
    "playwright>=1.64.0",
]
